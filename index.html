<!DOCTYPE html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Noa M. Fries</title>
        <style>
            body {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
                overflow: hidden;
                background: linear-gradient(-45deg, #01311F, #047c50, #e6cc7a);
                background-size: 400% 400%;
                animation: gradientShift 3000ms;
                animation-fill-mode: forwards
                }
                @keyframes gradientShift {
                0% { background-position: 0% 50%; }
                100% { background-position: 100% 50%; }
                
            }

            #content {
                text-align: center;
                transform: translateY(-38.2%);
            }

            h1 {
                color: #f7dc83;
                font-family: "Jersey 10", sans-serif;
                font-weight: 500;
                font-style: normal;
                font-size: 4.5rem;
                margin-bottom: 10px;
                transition: transform 0.4s ease-in-out;
                animation-name: plop;
                animation-duration: 2s;
            }
            @keyframes plop {
                0% { transform: scale(0); }
                50% { transform: scale(1.1); }
                100% { transform: scale(1); }
            }

            h1:hover {
                transform: scale(1.1);
                transition: transform 0.4s ease-in-out;
            }
            .icons {
                color: #f7dc83;
                background-color: #25d36500;
                padding: 10px 10px;
                border-radius: 5px;
                text-decoration: none;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                font-size: 2rem;
                transition: transform 0.2s ease-in-out;
                animation-name: plop;
                animation-duration: 3s;

            }
            .icons:hover {
                transform: scale(1.3);
                transition: transform 0.2s ease-in-out;
            }

        </style>
    </head>
    <body>
        <div id="content">
            <h1>Noa M. Fries</h1>
            <div id="buttons">
                <a href="https://github.com/nooa26" target="_blank" class="icons">
                    <i class="fa-brands fa-github"></i>
                </a>
                <a href="https://www.instagram.com/noaxfries" target="_blank" class="icons">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a href="https://signal.me/#eu/HxUIW6TEdqCqhjp7AicbmshAVIAFLewH-9pAwut-4GXkgpFx0XxBjr9GsvSXd2B2" target="_blank" class="icons">
                    <i class="fa-brands fa-signal-messenger"></i>
                </a>
            </div>
        </div>
    </body>
</html>
