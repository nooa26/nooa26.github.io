<!DOCTYPE html>
<html lang="de">
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Noa M. Fries</title>
        <style>
            :root {
                /* Farben: */
                --textfarbe: #d8c590;
            }
            body {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
                overflow: hidden;
                background: linear-gradient(-45deg,#01150f, #022f22, #095539);
                background-size: 500% 500%;
                animation: gradientShift 3000ms;
                animation-fill-mode: forwards
                }
                @keyframes gradientShift {
                0% { background-position: 0% 50%; }
                100% { background-position: 100% 50%; }
                
            }

            #content {
                text-align: center;
                transform: translateY(-38.2%);
            }

            h1 {
                color: var(--textfarbe);
                font-family: "Jersey 10", sans-serif;
                font-weight: 500;
                font-style: normal;
                font-size: 4.5rem;
                margin-bottom: 10px;

                overflow: hidden;
                border-right: .15em solid var(--textfarbe);
                white-space: nowrap;
                margin: 0 auto;
                letter-spacing: .05em;
                animation: 
                    typing 2s steps(40, end),
                    blink-caret .75s step-end infinite;
                
                /* transition: transform 0.4s ease-in-out;
                animation-name: plop;
                animation-duration: 4s; */
            }

            @keyframes typing {
                from { width: 0 }
                to { width: 100% }
                }

            @keyframes blink-caret {
                from, to { border-color: transparent }
                50% { border-color: var(--textfarbe); }
                }
            
            @keyframes plop {
                0% { transform: scale(0); }
                50% { transform: scale(0); }
                85% { transform: scale(0); }
                90% { transform: scale(0.95); }
                95% { transform: scale(1.025); }
                100% { transform: scale(1); }
            }

            /* h1:hover {
                transform: scale(1.1);
                transition: transform 0.4s ease-in-out;
            } */
            h1:active {
                transform: scale(0.5);
                transition: transform 0.4s ease-in-out;
            }
            .icons {
                color: var(--textfarbe);
                background-color: #25d36500;
                padding: 10px 10px;
                border-radius: 5px;
                text-decoration: none;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                font-size: 2rem;
                transition: transform 0.2s ease-in-out;
                animation-name: plop;
                animation-duration: 2s;
            }
            .icons:hover {
                transform: scale(1.3);
                transition: transform 0.2s ease-in-out;
            }
            .icons:active {
                transform: scale(0.5);
                transition: transform 0.4s ease-in-out;
            }
        </style>
    </head>
    <body>
        <div id="content">
            <h1>Noa M. Fries</h1>
            <div id="buttons">
                <a href="https://github.com/nooa26" target="_blank" class="icons">
                    <i class="fa-brands fa-github"></i>
                </a>
                <a href="https://www.instagram.com/noaxfries" target="_blank" class="icons">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a href="https://signal.me/#eu/HxUIW6TEdqCqhjp7AicbmshAVIAFLewH-9pAwut-4GXkgpFx0XxBjr9GsvSXd2B2" target="_blank" class="icons">
                    <i class="fa-brands fa-signal-messenger"></i>
                </a>
                <a href="mailto:noa.fries@gmail.com" class="icons">
                    <i class="fa-solid fa-envelope"></i>
                </a>
            </div>
        </div>
    </body>
</html>
